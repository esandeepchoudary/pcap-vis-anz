name: CI

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        timeout-minutes: 14
        run: "$GITHUB_WORKSPACE/.github/scripts/install-tshark.sh"
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen --extra postgres
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: t, POSTGRES_PASSWORD: t, POSTGRES_DB: t }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t -d t" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PCAPVIS_TEST_DATABASE_URL: postgresql+psycopg://t:t@127.0.0.1:5432/t
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen --extra postgres
      - run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: npm ci --no-audit --no-fund
      - name: API types are up to date with the backend
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "::error::Run 'npm run gen:api' and commit src/api/schema.d.ts" && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        timeout-minutes: 14
        run: "$GITHUB_WORKSPACE/.github/scripts/install-tshark.sh"
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: frontend/test-results, retention-days: 7 }

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pcapvis:ci .
      - name: tshark present and app starts healthy
        run: |
          docker run --rm pcapvis:ci check
          docker run -d --name app -p 8080:8080 pcapvis:ci
          for i in $(seq 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/api/system | tee /dev/stderr | grep -q '"ok":true'
          curl -sf localhost:8080/ | grep -q "<title>PCAP Network Visualizer"
          docker rm -f app

  # Routine: once every check above passes, merge the PR into develop automatically.
  # Only for PRs into develop, opened by the repo owner, not drafts, not labelled "no-automerge".
  # Releases to master stay manual. --match-head-commit merges exactly the commit that was tested.
  auto-merge:
    name: Auto-merge into develop
    needs: [backend, backend-postgres, frontend, e2e, docker]
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'develop'
      && github.event.pull_request.user.login == github.repository_owner
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "${{ github.repository }}" --merge --match-head-commit "$SHA"

