id: ot-log
title: View the OT Log's chronological command history
intent: >
  The OT Log view — a chronological table of OT command history (Modbus and
  S7comm reads, writes, and errors) with protocol and direction filter
  buttons. Lets an analyst review every industrial-control command exchanged
  between the engineering workstation and PLCs in a capture, in order.
maturity: stable
status: confirmed

code_paths:
  - static/js/app.js
  - templates/index.html

# preconditions:
#   auth: TODO — no login exists on this app (single anonymous-only surface)
#   seed: TODO
#   voice: TODO

steps:
  - action: goto
    path: /

  - capture: empty-state
    description: >
      Initial state: full-page drop zone ("Drop one or more capture files
      here or click to browse"), header stats all showing "—", no view tabs
      rendered yet (Graph/Table/DNS Map/OT Map/OT Log only appear
      post-upload).

  - action: upload
    selector: "input#file-input"
    file: fixtures/network-capture-demo.pcap
    # #file-input is the hidden <input type="file" accept=".pcap,.pcapng,.cap"
    # multiple> wired up behind the visible drop-zone element; clicking the
    # drop zone opens this input's native file chooser.

  - action: wait
    selector: "#loading-overlay"
    state: hidden
    # #graph-svg is present (empty) in the static HTML shell from the start,
    # so waiting on its role=img resolves immediately and races the actual
    # upload/parse/render cycle — captured a mid-upload spinner frame instead
    # of the finished graph. #loading-overlay only gets its "hidden" class
    # added (app.js) once the /upload response is parsed and rendered, so
    # this is the real stable signal.

  - action: click
    selector: "role=button[name='OT Log']"

  - action: wait
    selector: "button[data-view='otlog'].active"
    state: visible
    # A stable, explicit signal that setView("otlog") has actually run,
    # rather than relying on click's own post-action networkidle wait.

  - capture: ot-log-view
    description: >
      Resulting state observed with fixtures/network-capture-demo.pcap: the
      OT Log tab is active, a "Protocol:" filter row with Modbus/S7comm
      toggle buttons and a "Direction:" filter row with error/read/write
      toggle buttons sit above a "41 / 41 commands" counter, and a
      chronological table (columns Time, Src, Dst, Protocol, Function,
      Direction, Details) lists every OT command — e.g. Modbus "Write Single
      Register" (write) and "Read Holding Registers" (read) between
      10.0.2.10 and 10.0.2.50, and S7comm "Setup Communication", "Read
      Variable", "Write Variable", "Request Download", and "PLC Stop"
      entries between 10.0.2.10 and 10.0.2.51.
