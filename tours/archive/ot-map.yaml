id: ot-map
title: Explore OT/ICS devices in the OT Map Purdue swimlane view
intent: >
  The OT Map view — a Purdue Model swimlane view (L0 Field to L6 Public
  Internet) showing OT/ICS devices grouped by network zone, with a toggle
  to switch to an OT Communication Matrix (device x device adjacency grid).
  Upload a capture and switch to the OT Map tab to see the swimlane layout.

maturity: stable
status: confirmed

code_paths:
  - static/js/app.js
  - templates/index.html

# preconditions:
#   auth: TODO — no login exists on this app (single anonymous-only surface)
#   seed: TODO
#   voice: TODO

steps:
  - action: goto
    path: /

  - capture: empty-state
    description: >
      Initial state: full-page drop zone ("Drop one or more capture files
      here or click to browse"), header stats all showing "—", no view tabs
      rendered yet (OT Map only appears post-upload).

  - action: upload
    selector: "input#file-input"
    file: fixtures/network-capture-demo.pcap
    # #file-input is the hidden <input type="file" accept=".pcap,.pcapng,.cap"
    # multiple> wired up behind the visible drop-zone element; clicking the
    # drop zone opens this input's native file chooser.

  - action: wait
    selector: "#loading-overlay"
    state: hidden
    # #graph-svg is present (empty) in the static HTML shell from the start,
    # so waiting on its role=img resolves immediately and races the actual
    # upload/parse/render cycle. #loading-overlay only gets its "hidden"
    # class added (app.js) once the /upload response is parsed and
    # rendered, so this is the real stable signal.

  - action: click
    selector: "role=button[name='OT Map']"

  - capture: ot-map-swimlanes
    description: >
      OT Map view observed with fixtures/network-capture-demo.pcap: a
      summary bar reading "29 devices / 5 active levels / 14 cross-zone /
      2 cross-level / 5 bridges / 17 anomalies / filtered" plus a callout
      "Cross-zone traffic detected — review highlighted connections for
      security violations.", a zone/risk legend (IT Zone / Ind. DMZ / OT
      Zone; Critical/High/Medium/Low/Info; bridge/cross-zone/same-zone edge
      styles), a toolbar with Edit, zoom +/-, fit, a "Matrix" toggle button
      (unused in this tour), "Respect filters", and PNG/JSON export
      buttons, and the main canvas rendering the Purdue-model swimlane
      diagram grouping the capture's OT devices (including the Modbus PLCs
      at 10.0.2.50/10.0.2.51 and the engineering workstation at 10.0.2.10)
      by network zone, with an anomaly timeline strip along the bottom.
