[project]
name = "pcapvis"
description = "PCAP Network Visualizer v2: OT/ICS asset mapping and network analysis from packet captures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pwdlib[argon2]>=0.2",
    "orjson>=3.13.0",
    "python-multipart>=0.0.33",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
pcapvis = "pcapvis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "scapy>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth is the repo-root VERSION file; _version.py reads it.
source = "code"
path = "pcapvis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["pcapvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "E501",  # line length is enforced by `ruff format`; long message strings are left whole
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"pcapvis/migrations/*" = ["I", "E501"]
