# Developer CLI config: `uv run alembic revision --autogenerate -m "..."`.
# The app itself runs migrations programmatically (pcapvis/db/migrate.py).
[alembic]
script_location = pcapvis/migrations
sqlalchemy.url = sqlite:///./pcapvis-data/pcapvis.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
